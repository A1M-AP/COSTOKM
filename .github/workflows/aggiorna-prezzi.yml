# Aggiorna ogni giorno i prezzi dei carburanti dai dati aperti del MIMIT:
# medie nazionali (prezzi.json), medie regionali (prezzi-regioni.json) e storico (storico-prezzi.json).
# Se i dati cambiano, fa un commit su main: Cloudflare ripubblica il sito da solo.
# Se i prezzi dell'energia (aggiornati a mano) sono vecchi, apre una segnalazione (issue) come promemoria.
# Si può avviare anche a mano: Actions → "Aggiorna prezzi carburanti" → Run workflow.
name: Aggiorna prezzi carburanti

on:
  schedule:
    - cron: "17 9 * * *" # ogni giorno alle 9:17 UTC (dopo la pubblicazione dei dati del mattino)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aggiorna-prezzi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AVVISI_FILE: ${{ github.workspace }}/../avvisi-prezzi.txt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Scarica i dati MIMIT e calcola le medie
        run: node scripts/aggiorna-prezzi.mjs

      - name: Verifica (test e build)
        run: |
          npm test
          node build.mjs

      - name: Salva e pubblica
        run: |
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "Nessuna modifica ai prezzi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Prezzi carburanti aggiornati (MIMIT, $(date -u +%Y-%m-%d))"
          git push

      - name: Promemoria per i prezzi da aggiornare a mano
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$AVVISI_FILE" ]; then
            echo "Prezzi dell'energia aggiornati: nessun promemoria."
            exit 0
          fi
          TITOLO="Aggiornare i prezzi dell'energia elettrica"
          APERTE=$(gh issue list --state open --search "\"$TITOLO\" in:title" --json number --jq 'length')
          if [ "$APERTE" != "0" ]; then
            echo "Promemoria già aperto."
            exit 0
          fi
          {
            echo "L'aggiornamento automatico dei prezzi ha rilevato valori da aggiornare a mano in \`public/data/prezzi.json\`:"
            echo
            sed 's/^/- /' "$AVVISI_FILE"
            echo
            echo "Istruzioni nel README, sezione *Prezzi di carburanti ed energia*. Chiudi questa segnalazione dopo l'aggiornamento."
          } > "$RUNNER_TEMP/promemoria.md"
          gh issue create --title "$TITOLO" --body-file "$RUNNER_TEMP/promemoria.md"
