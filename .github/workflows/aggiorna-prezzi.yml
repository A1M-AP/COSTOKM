# Aggiorna ogni giorno i prezzi dei carburanti dai dati aperti del MIMIT:
# medie nazionali (prezzi.json), medie regionali (prezzi-regioni.json) e storico (storico-prezzi.json).
# Se i dati cambiano, fa un commit su main: Cloudflare ripubblica il sito da solo.
# Se i prezzi dell'energia (aggiornati a mano) sono vecchi, apre una segnalazione (issue) come promemoria.
# Si può avviare anche a mano: Actions → "Aggiorna prezzi carburanti" → Run workflow.
name: Aggiorna prezzi carburanti

on:
  schedule:
    - cron: "17 9 * * *" # ogni giorno alle 9:17 UTC (dopo la pubblicazione dei dati del mattino)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aggiorna-prezzi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AVVISI_FILE: ${{ github.workspace }}/../avvisi-prezzi.txt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Scarica i dati MIMIT e calcola le medie
        id: scarica
        run: |
          set +e
          node scripts/aggiorna-prezzi.mjs
          codice=$?
          echo "codice=$codice" >> "$GITHUB_OUTPUT"
          # 2 = sito del Ministero irraggiungibile: gestito con una segnalazione, non come errore
          if [ "$codice" = "2" ]; then exit 0; fi
          exit $codice

      - name: Segnala che il sito del Ministero non è raggiungibile
        if: steps.scarica.outputs.codice == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITOLO="Dati MIMIT non raggiungibili"
          APERTE=$(gh issue list --state open --search "\"$TITOLO\" in:title" --json number --jq 'length')
          if [ "$APERTE" != "0" ]; then echo "Segnalazione già aperta."; exit 0; fi
          ULTIMO=$(node -e "console.log(require('./public/data/prezzi.json').prezzi.benzina.riferimento)")
          {
            echo "L'aggiornamento automatico non riesce a scaricare i dati aperti del Ministero delle Imprese e del Made in Italy: il sito non risponde ai server di GitHub."
            echo
            echo "- Ultimo dato disponibile sul sito: **$ULTIMO** (la pagina dei prezzi avvisa i visitatori se i dati hanno più di 3 giorni)."
            echo "- L'azione riprova ogni giorno e chiuderà da sola questa segnalazione quando i dati torneranno disponibili."
            echo "- Per aggiornare a mano da un computer in Italia: \`node scripts/aggiorna-prezzi.mjs\`, poi commit e push di \`public/data\`."
          } > "$RUNNER_TEMP/irraggiungibile.md"
          gh issue create --title "$TITOLO" --body-file "$RUNNER_TEMP/irraggiungibile.md"

      - name: Chiudi la segnalazione se i dati sono tornati
        if: steps.scarica.outputs.codice == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search '"Dati MIMIT non raggiungibili" in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Dati di nuovo disponibili: aggiornamento automatico ripreso."
          done

      - name: Verifica (test e build)
        if: steps.scarica.outputs.codice == '0'
        run: |
          npm test
          node build.mjs

      - name: Salva e pubblica
        if: steps.scarica.outputs.codice == '0'
        run: |
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "Nessuna modifica ai prezzi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Prezzi carburanti aggiornati (MIMIT, $(date -u +%Y-%m-%d))"
          git push

      - name: Promemoria per i prezzi da aggiornare a mano
        if: steps.scarica.outputs.codice == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$AVVISI_FILE" ]; then
            echo "Prezzi dell'energia aggiornati: nessun promemoria."
            exit 0
          fi
          TITOLO="Aggiornare i prezzi dell'energia elettrica"
          APERTE=$(gh issue list --state open --search "\"$TITOLO\" in:title" --json number --jq 'length')
          if [ "$APERTE" != "0" ]; then
            echo "Promemoria già aperto."
            exit 0
          fi
          {
            echo "L'aggiornamento automatico dei prezzi ha rilevato valori da aggiornare a mano in \`public/data/prezzi.json\`:"
            echo
            sed 's/^/- /' "$AVVISI_FILE"
            echo
            echo "Istruzioni nel README, sezione *Prezzi di carburanti ed energia*. Chiudi questa segnalazione dopo l'aggiornamento."
          } > "$RUNNER_TEMP/promemoria.md"
          gh issue create --title "$TITOLO" --body-file "$RUNNER_TEMP/promemoria.md"
